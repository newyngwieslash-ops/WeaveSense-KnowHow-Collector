          commit=$(printf 'chore(knowhow): import pinned upstream source snapshot\n\nUpstream: %s\nWorkflows excluded pending connector restoration.\n' "$upstream_sha" | git commit-tree "$tree" -p "$expected_main")
          git update-ref "refs/heads/$branch" "$commit"
          auth=$(printf 'x-access-token:%s' "$GH_IMPORT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push "$target" "refs/heads/$branch:refs/heads/$branch"
          unset GH_IMPORT_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 auth
          printf 'Imported commit: %s\nImported tree: %s\n' "$commit" "$tree"
          printf 'Imported files: '
          git ls-tree -r --name-only "$commit" | wc -l
          printf 'This is the upstream baseline only; application overlay and final verification follow.\n'
