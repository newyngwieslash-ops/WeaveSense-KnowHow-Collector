name: One-time verified source import

on:
  push:
    branches: [import/knowhow-bootstrap-20261027]
    paths: [.github/workflows/one-time-source-import.yml]

permissions:
  contents: write

concurrency:
  group: one-time-knowhow-source-import-20261027
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'newyngwieslash-ops/WeaveSense-KnowHow-Collector' && github.ref == 'refs/heads/import/knowhow-bootstrap-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Import pinned public source snapshot without executing it
        shell: bash
        env:
          GH_IMPORT_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          upstream_sha=514c70f666cb04e3e72cbfb967fac74d9f350747
          expected_main=c4bd9672f7dba23e3e596b3203d977e9d2037e6b
          target=https://github.com/newyngwieslash-ops/WeaveSense-KnowHow-Collector.git
          branch=feat/video-knowledge-v1
          mkdir "$RUNNER_TEMP/knowhow-import"
          cd "$RUNNER_TEMP/knowhow-import"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 https://github.com/newyngwieslash-ops/WeaveSense-Math.git "$upstream_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$upstream_sha"
          test "$(git rev-parse "$upstream_sha^{tree}")" = 49e6bb2483857fbc86770a2b7e980e52b4850050
          git fetch --depth=1 "$target" refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$expected_main"
          git read-tree "$upstream_sha^{tree}"
          # Workflow files are restored separately through the authorized connector.
          # No upstream workflow or project program is executed during this import.
          git rm -q --cached -r --ignore-unmatch .github/workflows
          tree=$(git write-tree)
          existing=$(git ls-remote --heads "$target" "refs/heads/$branch" | cut -f1)
          if [ -n "$existing" ]; then
            git fetch --depth=2 "$target" "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$existing"
            test "$(git rev-parse "$existing^{tree}")" = "$tree"
            test "$(git rev-parse "$existing^1")" = "$expected_main"
            printf 'Verified existing baseline commit: %s\nFiles: ' "$existing"
            git ls-tree -r --name-only "$existing" | wc -l
            while IFS=' ' read -r expected path; do
              actual=$(git show "$existing:$path" | sha256sum | cut -d' ' -f1)
              test "$actual" = "$expected"
              printf 'Verified retained generated artifact: %s\n' "$path"
